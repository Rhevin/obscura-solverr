# FlareSolverr-compatible API on :8191 (drop-in for Prowlarr / *arr).
#
# Pull pre-built image from GHCR (published on git tag v*):
#   docker compose -f compose.solverr.yaml pull
#   docker compose -f compose.solverr.yaml up -d
#
# Apple Container + apple-compose (no compose `build:` support; build first):
#   container build -t ghcr.io/rhevin/obscura-solverr:latest -f Dockerfile .
#   apple-compose -f compose.solverr.yaml up
#
# Pin a release: image: ghcr.io/rhevin/obscura-solverr:1.0.0
#
# Build locally (apple-compose cannot use compose `build:`; tag must match `image:`):
#   docker build -t ghcr.io/rhevin/obscura-solverr:latest --build-arg OBSCURA_VERSION=solverr .
#
name: obscura-solverr

services:
  obscura-solverr:
    image: ghcr.io/rhevin/obscura-solverr:latest
    command:
      - solverr
      - --host
      - 0.0.0.0
      - --port
      - "8191"
      - --stealth
    ports:
      - "8191:8191"
    environment:
      # Short first-pass script budget; full budget applied on CF retry (see solve.rs).
      OBSCURA_SOLVERR_INITIAL_SCRIPT_MS: "45000"
      OBSCURA_SCRIPT_DEADLINE_MS: "120000"
      OBSCURA_NAV_TIMEOUT_MS: "130000"
      OBSCURA_FETCH_TIMEOUT_MS: "120000"
      RUST_LOG: obscura=info,obscura_solverr=info
    deploy:
      resources:
        limits:
          memory: 768M
